name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  github_release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_sha: ${{ steps.release_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          # Pinned: this job now writes uv.lock (via prepareCmd's `uv lock`) into an
          # unreviewed [skip ci] commit, so an unpinned uv could silently change the
          # lockfile format underneath that commit.
          python -m pip install uv==0.11.8
          uv tool install tox --with tox-uv

      - name: Generate License Files
        env:
          TOX_WRITE_THIRD_PARTY_LICENSES: true
        run: |
            tox -e python310
            # Ship the committed ATTRIBUTION.md, not a copy regenerated from this
            # runner's environment; tox also rewrites it, so restore the tracked one.
            git checkout -- attribution/ATTRIBUTION.md
            if [ ! -f "attribution/ATTRIBUTION.md" ]; then
              echo "Error: Expected file attribution/ATTRIBUTION.md does not exist"
              exit 1
            fi
            if [ ! -f "attribution/THIRD_PARTY_LICENSES.md" ]; then
              echo "Error: Expected file attribution/THIRD_PARTY_LICENSES.md does not exist"
              exit 1
            fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install semantic release and plugins
        run: |
          npm install -g semantic-release@v24.2.1 \
            conventional-changelog-cli \
            conventional-changelog-conventionalcommits@9.3.1 \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github

      - name: Semantic Release Run
        id: semantic
        run: |
          dry_run_output=$(semantic-release --dry-run 2>&1 || true)
          
          echo "$dry_run_output"

          # Check if there are no changes
          if [[ "$dry_run_output" == *"no new version is released"* ]]; then
            echo "No new release needed"
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract version from dry run output
          version=$(echo "$dry_run_output" | grep -oP "The next release version is \K[0-9]+\.[0-9]+\.[0-9]+")
          if [ -z "$version" ]; then
            echo "::error ::Could not determine version"
            exit 1
          fi
          
          echo "new_release_version=$version" >> $GITHUB_OUTPUT

          # Run actual release
          if semantic-release; then
            echo "Release successful"
            echo "new_release_published=true" >> $GITHUB_OUTPUT
          else
            echo "Release failed"
            exit 1
          fi
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Capture released commit SHA
        id: release_sha
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          sha=$(git rev-parse --verify "refs/tags/$VERSION^{commit}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  publish:
    needs: github_release
    if: >-
      needs.github_release.outputs.new_release_published == 'true' &&
      needs.github_release.outputs.new_release_sha != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.github_release.outputs.new_release_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv twine setuptools

      - name: Build the package
        run: uv build --out-dir dist --wheel

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

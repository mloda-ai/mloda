[build-system]
requires = ["setuptools>=77.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mloda"
version = "0.17.0"
description = "mloda.ai: Open Data Access for ML and AI"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
    { name = "Tom Kaltofen", email = "info@mloda.ai" }
]
dependencies = []

requires-python = ">=3.11,<3.15"
keywords = ["ai-agents", "data-access", "feature-engineering", "data-pipeline", "mlops", "llmops", "rag", "lineage", "plugin-framework"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Pytest",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-xdist",
    "pytest-order",
    "pytest-timeout",
    "ruff",
    "mypy",
    "mktestdocs",
    "pandera",
    "pyarrow>=14.0.1",
    "ipykernel",
    "bandit",
    "pyyaml",
    "types-PyYAML",
    "types-requests",
    "types-toml",
    "scikit-learn>=1.0.0",
    "pip-audit<2.11.0",
    "pip-licenses-cli",
]
# Every group that pulls in pyarrow needs >=14.0.1 (CVE-2023-47248).
pyarrow = ["pyarrow>=14.0.1"]
pandas = ["pandas"]
polars = ["polars>=1.21"]
numpy = ["numpy"]
yaml = ["pyyaml"]
duckdb = ["duckdb", "pyarrow>=14.0.1"]
sqlite = ["pyarrow>=14.0.1"]
iceberg = ["pyiceberg", "pyarrow>=14.0.1"]
spark = ["pyspark>=3.5", "pyarrow>=14.0.1"]
sklearn = [
    "scikit-learn>=1.0.0",
    "joblib>=1.0.0",
]
text_cleaning = ["nltk>=3.8"]
mcp = ["mcp>=2.3,<3"]
nopyarrow_test = [
    "pytest>=9.0.3",
    "pytest-xdist",
    "pytest-order",
    "pytest-timeout",
]
docs = [
    "mkdocs",
    "mkdocs-jupyter",
    "notebook",
    "mermaid-py",
    "marimo",
    # Backends the example notebooks execute during the docs build.
    "mloda[pandas]",
    "mloda[polars]",
    "mloda[pyarrow]",
    "mloda[sklearn]",
]
all = [
    "mloda[test]",
    "mloda[pyarrow]",
    "mloda[pandas]",
    "mloda[polars]",
    "mloda[numpy]",
    "mloda[yaml]",
    "mloda[duckdb]",
    "mloda[sqlite]",
    "mloda[iceberg]",
    "mloda[sklearn]",
    "mloda[text_cleaning]",
    "mloda[mcp]",
    "mloda[docs]",
]

[project.scripts]
mloda = "mloda.interfaces.cli.main:main"
mloda-mcp = "mloda.interfaces.mcp.main:main"

[project.entry-points.pytest11]
mloda = "mloda.core.abstract_plugins.plugin_registry.fixtures"

[project.urls]
"Bug Tracker" = "https://github.com/mloda-ai/mloda/issues"
"Documentation" = "https://mloda-ai.github.io/mloda/"
"Source Code" = "https://github.com/mloda-ai/mloda"
"PyPI" = "https://pypi.org/project/mloda/"
"Homepage" = "https://mloda.ai"

[tool.setuptools.packages.find]
where = ["."]
include = ["mloda.*", "mloda_plugins*"]
exclude = ["mloda.community*", "mloda.enterprise*", "mloda.registry*", "mloda.testing*"]
namespaces = true

[tool.setuptools]
include-package-data = true

[tool.bandit]
# Bandit matches entries as substrings of scanned paths; anchored to "./" because tox scans "." from the repo root.
exclude_dirs = [
    "./venv/",
    "./.venv/",
    "./build/",
    "./dist/",
    "./.devcontainer/",
    "./.tox/",
    "./.vscode/",
    "./attribution/",
    "./.cache/",
    "./.claude/",
    "*.egg-info/*",
    "/site-packages/"
]
skips = [
    "B101", # Use of assert detected. The enclosed code will be removed when compiling to optimised byte code.
    "B104"  # Possible binding to all interfaces detected.
]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
# marimo notebooks are unannotated reactive cells; validated by execution, not mypy.
# build/ is excluded so a stray local build artifact does not break the gate.
exclude = [
    'docs/docs/examples/base_usage\.py$',
    'docs/docs/examples/sklearn_integration_basic\.py$',
    'docs/docs/examples/mloda_basics/\d.*\.py$',
    '^build/',
]

[[tool.mypy.overrides]]
module = "mloda_plugins.compute_framework.base_implementations.iceberg.iceberg_filter_engine"
disable_error_code = ["misc", "call-arg", "arg-type"]

[[tool.mypy.overrides]]
module = "tests.test_plugins.compute_framework.base_implementations.iceberg.test_iceberg_filter_engine"
disable_error_code = ["misc", "call-arg", "arg-type"]

[[tool.mypy.overrides]]
module = [
    "pyarrow.compute",
    "pyarrow.csv",
    "pyarrow.feather",
    "pyarrow.flight",
    "pyarrow.ipc",
    "pyarrow.json",
    "pyarrow.orc",
    "pyarrow.parquet",
]
follow_imports = "skip"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["UP006", "UP007", "UP036", "UP045"]

[tool.ruff.lint.per-file-ignores]
# marimo notebook idioms static linting can't follow (cell imports, re-exports, cross-cell names).
"docs/docs/examples/**/*.py" = ["E402", "F401", "F821", "F841"]

[tool.uv]
exclude-newer = "7 days"
# decorator 5.3.0 ships empty License metadata so pip-licenses can't classify it; 5.3.1 fixes this.
# Opt decorator out of the rolling window so the latest published version is always accepted.
# certifi 2026.10.19 is a security fix inside the window; drop this entry after 2026-10-27.
exclude-newer-package = { decorator = "2099-01-01T00:00:00Z", certifi = "2026-10-21T00:00:00Z" }
# Constraints applied only to transitive dependencies to remediate Dependabot security alerts.
# - urllib3 >= 2.7.0: GHSA decompression-bomb bypass + sensitive headers across origins
# - idna   >= 3.15:   idna.encode() bypass of CVE-2024-3651 fix
# - mistune >= 3.3.3: RecursionError DoS via excessive emphasis markers. Also covers the earlier
#   quadratic-time parsing DoS in parse_link_text and heading ID injection XSS (CVE-2026-33079).
# - soupsieve >= 2.9.0: memory exhaustion via large comma-separated selector lists; ReDoS in the selector
#   parser, including the IDENTIFIER/VALUE sub-patterns and the RE_WS_END whitespace/comment trimming regex
# - nbconvert >= 7.17.1: arbitrary file read/write via path traversal; uncontrolled search path on Windows
# - anyio >= 4.14.2: TLSStream IDNA 2003 host name encoding allows TLS certificate spoofing; process-pool
#   workers can block indefinitely on undrained stderr
# - fsspec >= 2026.6.0: template injection in ReferenceFileSystem
# - certifi >= 2026.10.19: bundled emSign root CAs with compromised intermediate CA keys
constraint-dependencies = [
    "urllib3>=2.7.0",
    "idna>=3.15",
    "mistune>=3.3.3",
    "soupsieve>=2.9.0",
    "nbconvert>=7.17.1",
    "anyio>=4.14.2",
    "fsspec>=2026.6.0",
    "certifi>=2026.10.19",
]
# Overrides, not constraints: marimo pins `pymdown-extensions<11`, and the fix for the
# b64 path-traversal advisory only ships in 11.0. A constraint cannot beat that upper
# pin, so the pin is overridden here. Drop this once marimo allows 11.x.
override-dependencies = [
    "pymdown-extensions>=11.0.1",
]

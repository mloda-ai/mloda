[pytest]
markers =
    notebooks: marimo example-notebook execution tests (slow; run via `tox -e notebooks`)
    slow: full hash-seed and fresh-interpreter probe sweeps (run via `tox -e slow`)
filterwarnings =
    ignore::pytest.PytestUnhandledThreadExceptionWarning
    ignore:.*Jupyter is migrating its paths to use standard platformdirs:DeprecationWarning
